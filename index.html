    * {

    body {

    .container {
      width: 100%;

    .logo {

    .content {
      flex: 1;

      justify-content: flex-start;

      max-width: 100%;

    h1 {
      color: #ff6205;
      font-size: 150px;
      font-weight: 500;
      line-height: 140px;
      margin-bottom: 1.5rem;

    p {
      max-width: 28rem;
      font-size: 24px;
      line-height: 35px;
      margin-bottom: 3rem;
      font-weight: 55;
    }

    .highlight {
      color: #ff6205;
      font-style: italic;
    }

    .button {
      display: inline-block;
      background-color: #ff6205;
      color: white;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 9999px;
      font-size: 1.125rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.3s ease;
      margin-top: auto;
      margin-bottom: 2rem;
      width: 28rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(255, 98, 5, 0.2);
    }

    .button:hover {
      background-color: rgba(255, 98, 5, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(255, 98, 5, 0.3);
    }

    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      perspective: 1000px;
    }

    @keyframes float1 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(50px, 30px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes float2 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 35px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes float3 {
      0% { transform: translate(0, 0); }
      50% { transform: translate(30px, -40px); }
      100% { transform: translate(0, 0); }
    }

    @media (max-width: 1200px) {

<body>
  <!-- Particle Background -->
  <div class="particle-container" id="particles"></div>

  <div class="container">
    <!-- Logo -->
    <img src="BigBearElectricalLtd.png" alt="BigBear Electrical Ltd. Logo" class="logo">

    <!-- Main content -->
    <main class="content">
      <h1>Coming<br>Soon</h1>
      
      <p>
        <span class="highlight">BigBear Electrical Ltd.</span> offers certified electrical 
        services for domestic, commercial, and light industrial clients in North Lincolnshire, covering 
        everything from minor repairs to full installations and rewires.
      </p>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const particleContainer = document.getElementById('particles');
      const particleCount = Math.min(Math.floor((window.innerWidth * window.innerHeight) / 30000), 20);
      
      // Create particles
      for (let i = 0; i < particleCount; i++) {
        createParticle(particleContainer, i);
      }
      
      // Handle window resize
      let resizeTimeout;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
          // Clear existing particles
          particleContainer.innerHTML = '';
          
          // Recalculate particle count
          const newParticleCount = Math.min(Math.floor((window.innerWidth * window.innerHeight) / 30000), 20);
          
          // Create new particles
          for (let i = 0; i < newParticleCount; i++) {
            createParticle(particleContainer, i);
          }
        }, 250);
      });
    });
    
    function createParticle(container, id) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      
      // Random properties
      const size = Math.random() * 60 + 40; // Larger particles
      const opacity = Math.random() * 0.3 + 0.2;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const duration = Math.random() * 10 + 20; // Slower animation
      const delay = Math.random() * -20;
      const floatType = Math.floor(Math.random() * 3) + 1;
      
      // Apply styles
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${x}%`;
      particle.style.top = `${y}%`;
      particle.style.background = `radial-gradient(circle, rgba(255, 98, 5, ${opacity}) 0%, rgba(255, 98, 5, ${opacity * 0.4}) 70%, rgba(255, 98, 5, 0) 100%)`;
      particle.style.animation = `float${floatType} ${duration}s infinite ease-in-out ${delay}s`;
      
      // Add to container
      container.appendChild(particle);
    }
  </script>
</body>
